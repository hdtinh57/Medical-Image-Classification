apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # cố định để dashboard tham chiếu được
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki                # cố định để dashboard/Explore tham chiếu được
    access: proxy
    url: http://loki:3100
    editable: true
