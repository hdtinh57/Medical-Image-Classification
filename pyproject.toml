[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# asyncio_mode=auto: pytest-asyncio handles all async tests automatically
# without requiring @pytest.mark.asyncio on every test.
# -p no:anyio: anyio plugin crashes during collection on Windows.
asyncio_mode = "auto"
addopts = "-q --strict-markers -p no:anyio"
markers = [
    "integration: cần Docker/MinIO/Triton đang chạy (không chạy trong job test nhẹ)",
    "asyncio: mark a test as async (handled by pytest-asyncio)",
]
