[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -p no:anyio: plugin anyio crash lúc collect trên runtime Windows; suite này
# không có async test nào cần nó.
addopts = "-q --strict-markers -p no:anyio"
markers = [
    "integration: cần Docker/MinIO/Triton đang chạy (không chạy trong job test nhẹ)",
]
