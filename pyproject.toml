[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: cần Docker/MinIO/Triton đang chạy (không chạy trong job test nhẹ)",
]

# The installed anyio plugin crashes during collection on this Windows runtime;
# this suite has no async tests that require it.
addopts = "-p no:anyio"
