# Gated Continuous Delivery for artifacts produced by Train candidate model.
# The package job never receives MinIO/Triton credentials. The protected deploy job
# receives environment-scoped secrets only after model-production approval.
name: Release model

on:
  workflow_run:
    workflows: ["Train candidate model"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Train candidate model workflow run ID from main"
        required: true
        type: string

concurrency:
  group: release-model-${{ github.event.workflow_run.head_sha || inputs.source_run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  package:
    name: Verify candidate and package ONNX
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_run_id: ${{ steps.source.outputs.run_id }}
      model_version: ${{ steps.candidate.outputs.model_version }}
    env:
      MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      # Re-query the workflow run for both event paths. This prevents a manually
      # supplied run ID or a fork-originated workflow artifact becoming deploy input.
      - name: Validate trusted source workflow run
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          event_name = os.environ["GITHUB_EVENT_NAME"]
          run_id = os.environ["WORKFLOW_RUN_ID"] if event_name == "workflow_run" else os.environ["MANUAL_SOURCE_RUN_ID"]
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("source_run_id must be a positive workflow run ID")
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              },
          )
          with urlopen(request, timeout=20) as response:
              source = json.loads(response.read().decode("utf-8"))
          head_repository = source.get("head_repository") or {}
          trusted = (
              source.get("conclusion") == "success"
              and source.get("head_branch") == "main"
              and source.get("name") == "Train candidate model"
              and head_repository.get("full_name") == os.environ["GITHUB_REPOSITORY"]
          )
          if not trusted:
              raise SystemExit("source run is not a successful trusted main training workflow")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\nsha={source['head_sha']}\n")
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt --upgrade-strategy only-if-needed

      - uses: actions/download-artifact@v8
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}/candidate-bundle
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify bundle and ONNX numerical parity
        id: candidate
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/candidate-bundle
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from training.deploy import load_candidate_bundle
          from training.export_triton import ExportConfig, run_export
          from training.quality_gate import evaluate_quality_gate

          candidates = list(Path(os.environ["CANDIDATE_ROOT"]).rglob("candidate.json"))
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one candidate bundle, found {len(candidates)}")
          bundle_dir = candidates[0].parent
          candidate = load_candidate_bundle(bundle_dir)
          if candidate.metadata["git_sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("candidate Git SHA does not match the trusted source workflow")
          if not evaluate_quality_gate(candidate.validation_metrics, candidate.thresholds).passed:
              raise SystemExit("candidate did not pass the re-evaluated Validation gate")
          onnx_path = run_export(
              ExportConfig(
                  version=candidate.version,
                  local_checkpoint=candidate.checkpoint_path,
                  upload=False,
              )
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model_version={candidate.version}\n")
              output.write(f"bundle_dir={bundle_dir}\n")
              output.write(f"onnx_path={onnx_path}\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/candidate-bundle/
            model_repository/skin_classifier/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Protected MinIO and Triton deployment
    needs: package
    if: needs.package.result == 'success'
    runs-on: [self-hosted, Windows, X64, mlops-deploy]
    environment:
      name: model-production
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.source_sha }}

      # mlops-deploy must be provisioned with a compatible Python/CUDA environment.
      # This only fills missing project dependencies and must not substitute demo secrets.
      - name: Install missing deployment dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --upgrade-strategy only-if-needed

      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
          github-token: ${{ github.token }}

      - name: Register, publish, smoke test, and promote
        shell: pwsh
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          TRITON_HTTP_URL: ${{ secrets.TRITON_HTTP_URL }}
        run: |
          $candidates = Get-ChildItem -Path "$env:RUNNER_TEMP\release-bundle" -Filter candidate.json -Recurse
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one candidate.json in release-bundle; found $($candidates.Count)."
          }
          $bundleDir = $candidates[0].Directory.FullName
          python -m training.deploy --bundle-dir "$bundleDir" --timeout-seconds 60 --poll-seconds 3
