# Pipeline model: .pth -> ONNX -> MinIO (Triton model repository) -> verify.
#
# MinIO của nhóm chạy localhost, runner GitHub không kết nối được -> CI dựng
# MinIO EPHEMERAL ngay trong job. Nó chứng minh trọn pipeline export+upload+load
# chạy đúng; artifact ONNX được upload lên GitHub để tải về dùng thật.
name: Release model

on:
  # prod là cổng cuối trước khi code được coi là chạy thật -> verify trọn pipeline
  # model ở đây, không phải ở main (main chỉ giữ docs/mốc ổn định).
  pull_request:
    branches: [prod]
  push:
    tags: ["model-v*"]
  workflow_dispatch:
    inputs:
      model_version:
        description: "Version model trong Triton repo"
        required: false
        default: "1"
      run_triton_smoke:
        description: "Chạy luôn Triton thật (chậm ~10 phút, image vài GB)"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-model-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MODEL_VERSION: ${{ inputs.model_version || '1' }}
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

jobs:
  export:
    name: Export ONNX + đẩy lên MinIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # torch CPU wheel (~200MB) thay vì bản CUDA (~2.5GB) — runner không có GPU.
      # Cài torch TRƯỚC để timm không tự kéo bản CUDA từ PyPI về.
      # onnxscript: bắt buộc cho torch.onnx.export(dynamo=True) trong export_triton.py.
      - name: Cài deps export (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install timm onnx onnxscript onnxruntime boto3

      - name: Dựng MinIO ephemeral
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live

      # Chưa có checkpoint thật trong CI -> sinh checkpoint random qua build_checkpoint()
      # để đúng format tự mô tả mà validate_checkpoint() yêu cầu (không hardcode lại).
      # Đây là test pipeline, KHÔNG phải train — đúng nguyên tắc "không train trong CI".
      - name: Sinh checkpoint giả để test pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          import torch

          from training.model import BASELINE_ARCH, NUM_CLASSES, build_checkpoint, create_model

          Path("model").mkdir(exist_ok=True)
          model = create_model(BASELINE_ARCH, pretrained=False)
          torch.save(
              build_checkpoint(model, architecture=BASELINE_ARCH, epoch=0, metrics={}),
              "model/best_checkpoint.pth",
          )
          print(f"checkpoint giả: {BASELINE_ARCH}, {NUM_CLASSES} lớp")
          PY

      # --upload: không có flag này script chỉ verify local, MinIO sẽ rỗng.
      - name: export_triton.py -> ONNX -> MinIO
        run: |
          python training/export_triton.py \
            --local-checkpoint model/best_checkpoint.pth \
            --version "${MODEL_VERSION}" \
            --upload

      # Chứng minh upload thật sự thành công: kéo ONNX từ MinIO xuống rồi infer.
      # onnxruntime chính là backend Triton dùng (platform: onnxruntime_onnx).
      - name: Verify round-trip qua MinIO
        run: |
          python - <<'PY'
          import os, tempfile, boto3, numpy as np, onnxruntime as ort
          from training.model import MODEL_NAME, NUM_CLASSES

          version = os.environ["MODEL_VERSION"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["MINIO_ENDPOINT"],
              aws_access_key_id=os.environ["MINIO_ACCESS_KEY"],
              aws_secret_access_key=os.environ["MINIO_SECRET_KEY"],
              region_name="us-east-1",
          )
          keys = [o["Key"] for o in s3.list_objects_v2(Bucket="models").get("Contents", [])]
          print("objects trên MinIO:", keys)
          for required in (f"{MODEL_NAME}/config.pbtxt", f"{MODEL_NAME}/labels.txt",
                           f"{MODEL_NAME}/{version}/model.onnx"):
              assert required in keys, f"thiếu {required} trên MinIO"

          with tempfile.NamedTemporaryFile(suffix=".onnx", delete=False) as f:
              s3.download_fileobj("models", f"{MODEL_NAME}/{version}/model.onnx", f)
              path = f.name

          sess = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          x = np.random.rand(1, 3, 224, 224).astype(np.float32)
          out = sess.run(None, {"input": x})[0]
          assert out.shape == (1, NUM_CLASSES), out.shape
          print(f"round-trip OK, logits shape = {out.shape}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: skin_classifier-onnx-v${{ env.MODEL_VERSION }}
          path: |
            model_repository/skin_classifier/${{ env.MODEL_VERSION }}/model.onnx
            model_repository/skin_classifier/config.pbtxt
            model_repository/skin_classifier/labels.txt
          if-no-files-found: error

      - name: Dọn MinIO
        if: always()
        run: docker rm -f minio || true

  triton-smoke:
    name: Triton load + infer (chạy tay)
    if: inputs.run_triton_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Image Triton vài GB — dọn chỗ trước kẻo hết disk giữa chừng.
      - name: Giải phóng disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install timm onnx onnxscript onnxruntime boto3 "tritonclient[http]" numpy

      - name: Dựng MinIO + đẩy model
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          python - <<'PY'
          from pathlib import Path

          import torch

          from training.model import BASELINE_ARCH, build_checkpoint, create_model

          Path("model").mkdir(exist_ok=True)
          torch.save(
              build_checkpoint(
                  create_model(BASELINE_ARCH, pretrained=False),
                  architecture=BASELINE_ARCH,
                  epoch=0,
                  metrics={},
              ),
              "model/best_checkpoint.pth",
          )
          PY
          python training/export_triton.py \
            --local-checkpoint model/best_checkpoint.pth \
            --version "${MODEL_VERSION}" --upload

      # --network host để Triton thấy MinIO ở localhost:9000, giống compose.
      - name: Chạy Triton
        run: |
          docker run -d --name triton --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            -e AWS_DEFAULT_REGION=us-east-1 \
            nvcr.io/nvidia/tritonserver:24.08-py3 \
            tritonserver --model-repository=s3://http://localhost:9000/models \
                         --model-control-mode=poll --repository-poll-secs=10 \
                         --exit-on-error=false --allow-metrics=true --metrics-port=8002

      - name: Chờ model ready
        run: |
          for _ in $(seq 60); do
            if curl -sf http://localhost:8000/v2/models/skin_classifier/ready; then
              echo "model ready"; exit 0
            fi
            sleep 5
          done
          echo "::error::Triton không nạp được model trong 5 phút"
          docker logs triton | tail -50
          exit 1

      - name: Smoke infer qua Triton
        run: |
          python - <<'PY'
          import numpy as np, tritonclient.http as http
          from training.model import MODEL_NAME, NUM_CLASSES

          c = http.InferenceServerClient(url="localhost:8000")
          x = np.random.rand(1, 3, 224, 224).astype(np.float32)
          inp = http.InferInput("input", x.shape, "FP32")
          inp.set_data_from_numpy(x)
          out = c.infer(MODEL_NAME, [inp], outputs=[http.InferRequestedOutput("logits")])
          assert out.as_numpy("logits").shape == (1, NUM_CLASSES)
          print("Triton infer OK")
          PY

      - name: Triton có phát metrics cho Prometheus
        run: curl -sf http://localhost:8002/metrics | grep nv_inference_request_success

      - name: Dọn
        if: always()
        run: docker rm -f triton minio || true
