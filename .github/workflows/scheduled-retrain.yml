# =============================================================================
# Scheduled Model Retraining — DDM501 Continuous Training
#
# Triggers:
#   - Weekly cron schedule (every Monday 03:00 UTC)
#   - Manual dispatch with configurable parameters
#   - Drift alert webhook (when monitoring detects drift)
#
# This workflow runs on a self-hosted Docker runner on the local machine.
# Runner image: myoung34/github-runner (Ubuntu/Linux)
# =============================================================================

name: Scheduled Retrain

on:
  schedule:
    # Weekly Monday 03:00 UTC — adjust based on data freshness needs
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual retrain trigger"
        required: true
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - drift_detected
          - performance_degradation
          - new_data_available
      architecture:
        description: "Model architecture"
        required: false
        default: "resnet18"
        type: choice
        options:
          - resnet18
          - convnextv2_tiny.fcmae_ft_in22k_in1k
      epochs:
        description: "Training epochs"
        required: false
        default: "10"
        type: string

# Only one retrain at a time
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # Step 1: Check if retraining is needed
  # -------------------------------------------------------------------
  check-drift:
    name: Check production drift
    runs-on: self-hosted
    outputs:
      should_retrain: ${{ steps.drift.outputs.should_retrain }}
      drift_status: ${{ steps.drift.outputs.drift_status }}
    steps:
      - name: Query drift endpoint
        id: drift
        run: |
          DRIFT_URL="${{ secrets.GATEWAY_URL || 'http://gateway:8000' }}/drift"
          STATUS="unknown"
          SHOULD_RETRAIN="true"

          if curl -sf "$DRIFT_URL" -o drift.json 2>/dev/null; then
            STATUS=$(python3 -c "import json,sys; d=json.load(open('drift.json')); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Drift status: $STATUS"
            cat drift.json

            # Only skip if drift is stable AND this is a scheduled run
            if [[ "$STATUS" == "stable" && "${{ github.event_name }}" == "schedule" ]]; then
              SHOULD_RETRAIN="false"
              echo "No drift detected — skipping scheduled retrain."
            fi
          else
            echo "Could not reach drift endpoint — proceeding with retrain."
          fi

          echo "should_retrain=$SHOULD_RETRAIN" >> "$GITHUB_OUTPUT"
          echo "drift_status=$STATUS" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Step 2: Run training pipeline
  # -------------------------------------------------------------------
  retrain:
    name: Retrain model
    needs: check-drift
    if: needs.check-drift.outputs.should_retrain == 'true'
    runs-on: self-hosted
    outputs:
      version: ${{ steps.train.outputs.version }}
      candidate_dir: ${{ steps.train.outputs.candidate_dir }}
      quality_gate: ${{ steps.train.outputs.quality_gate }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CUDA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -r requirements.txt

      - name: Determine next version
        id: version
        run: |
          # Find max existing candidate version
          CANDIDATES_DIR="artifacts/pipeline/candidate"
          MAX_VERSION=0
          if [ -d "$CANDIDATES_DIR" ]; then
            for d in "$CANDIDATES_DIR"/v*/; do
              if [[ "$d" =~ v([0-9]+)/$ ]]; then
                v="${BASH_REMATCH[1]}"
                if [ "$v" -gt "$MAX_VERSION" ]; then MAX_VERSION=$v; fi
              fi
            done
          fi
          NEXT_VERSION=$((MAX_VERSION + 1))
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEXT_VERSION"

      - name: Run training pipeline
        id: train
        env:
          ARCH: ${{ inputs.architecture || 'resnet18' }}
          EPOCHS: ${{ inputs.epochs || '10' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m training.pipeline \
            --version "$VERSION" \
            --arch "$ARCH" \
            --epochs "$EPOCHS" \
            --skip-ingest --skip-eda \
            --seed 42

          CANDIDATE_DIR="artifacts/pipeline/candidate/v${VERSION}"
          echo "candidate_dir=$CANDIDATE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Read quality gate result
          QUALITY_GATE=$(python3 -c "import json; d=json.load(open('${CANDIDATE_DIR}/quality_gate.json')); print(d['passed'])" 2>/dev/null || echo "False")
          echo "quality_gate=$QUALITY_GATE" >> "$GITHUB_OUTPUT"
          echo "Quality gate: $QUALITY_GATE"

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v${{ steps.version.outputs.version }}
          path: ${{ steps.train.outputs.candidate_dir }}

  # -------------------------------------------------------------------
  # Step 3: Deploy if quality gate passed
  # -------------------------------------------------------------------
  deploy:
    name: Deploy retrained model
    needs: retrain
    if: needs.retrain.outputs.quality_gate == 'True'
    runs-on: self-hosted
    environment: model-production
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-v${{ needs.retrain.outputs.version }}
          path: candidate-bundle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -r requirements.txt

      - name: Deploy to production
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || 'http://minio:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}
          TRITON_HTTP_URL: ${{ secrets.TRITON_HTTP_URL || 'http://triton:8000' }}
        run: |
          python -m training.deploy \
            --bundle-dir candidate-bundle \
            --timeout-seconds 120

  # -------------------------------------------------------------------
  # Step 4: Notify result
  # -------------------------------------------------------------------
  notify:
    name: Report result
    needs: [check-drift, retrain, deploy]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Summary
        run: |
          echo "## Scheduled Retrain Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift status | ${{ needs.check-drift.outputs.drift_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Retrain needed | ${{ needs.check-drift.outputs.should_retrain }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality gate | ${{ needs.retrain.outputs.quality_gate || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.retrain.outputs.version || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
