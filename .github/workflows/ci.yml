# Lightweight source/config CI. Full training runs in train-model.yml on a trusted GPU runner.
name: CI

# Luồng: feat/** -> dev -> prod. main là default branch (docs/mốc ổn định).
# CI chạy trên PR vào cả 3 branch dài hạn vì mỗi lần merge đều là một cổng.
on:
  push:
    branches: [main, dev, prod, "feat/**"]
  pull_request:
    branches: [main, dev, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RUFF_VERSION: "0.8.6"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: python -m pip install ruff==${{ env.RUFF_VERSION }}

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Unit + data-quality + model-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=training --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  validate-config:
    name: Validate compose + Prometheus + Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config
        run: docker compose config --quiet

      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Grafana dashboards are valid JSON
        run: |
          shopt -s nullglob
          for f in monitoring/grafana/dashboards/*.json; do
            python -m json.tool "$f" > /dev/null && echo "OK  $f"
          done
