# CI chạy mọi push/PR. KHÔNG train, KHÔNG kéo image Triton — việc nặng nằm ở
# release-model.yml. Job test cần torch (CPU wheel) vì suite đã cover training/.
name: CI

# Luồng: feat/** -> dev -> prod. main là default branch (docs/mốc ổn định).
# CI chạy trên PR vào cả 3 branch dài hạn vì mỗi lần merge đều là một cổng.
on:
  push:
    branches: [main, dev, prod, "feat/**"]
  pull_request:
    branches: [main, dev, prod]

# Push liên tiếp -> huỷ run cũ, không xếp hàng tốn CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Phải khớp .pre-commit-config.yaml, lệch version = local pass / CI fail.
  RUFF_VERSION: "0.8.6"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install ruff==${{ env.RUFF_VERSION }}

      # --output-format=github -> lỗi hiện annotation ngay trên diff của PR
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Unit + data-quality + model-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements.txt kéo torch/torchvision. Trên PyPI bản Linux mặc định là
      # wheel CUDA (~2.5GB) -> cài CPU wheel TRƯỚC, pip thấy đã thoả version thì bỏ qua.
      - name: Cài deps (torch CPU wheel)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=training --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  validate-config:
    name: Validate compose + Prometheus + Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bắt lỗi cú pháp/biến thiếu trong compose trước khi ai đó `up` thất bại.
      - name: docker compose config
        run: docker compose config --quiet

      # promtool validate cả prometheus.yml lẫn alert_rules.yml (qua rule_files).
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Grafana dashboards là JSON hợp lệ
        run: |
          shopt -s nullglob
          for f in monitoring/grafana/dashboards/*.json; do
            python -m json.tool "$f" > /dev/null && echo "OK  $f"
          done
